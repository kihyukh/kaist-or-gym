[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kaist-rl-lab"
version = "0.1.22"
description = "Custom Gym/Gymnasium environments for operations research problems"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Kihyuk Hong", email = "kihyukh@kaist.ac.kr" }]
dependencies = [
  "gymnasium>=1.2.0",
  "numpy>=1.23",
  "matplotlib>=3.0",
  "ipython>=7.34.0",
  "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff", "mypy"]
examples = ["gradio>=6.26,<7"]
interactive = ["gradio>=6.26,<7"]
human = ["pygame>=2.5,<3"]
test = ["pytest>=7", "gymnasium[other]>=0.29"]
web = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "qrcode>=8,<9"]
web-test = ["pytest>=7", "httpx>=0.27,<1"]

[project.scripts]
coffee-pouring-app = "kaist_rl_lab.apps.coffee_pouring_app:main"
laundry-folding-app = "kaist_rl_lab.apps.laundry_folding_app:main"
coffee-pouring-web = "kaist_rl_lab.apps.coffee_web:main"

[tool.setuptools.packages.find]
include = ["kaist_rl_lab*"]

[tool.setuptools.package-data]
"kaist_rl_lab.apps" = ["coffee_examples/*.npz"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
